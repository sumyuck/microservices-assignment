server:
  port: 8083
spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/orders}
    username: ${SPRING_DATASOURCE_USERNAME:order}
    password: ${SPRING_DATASOURCE_PASSWORD:course-order-password}
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: course
    password: course
resilience4j:
  circuitbreaker:
    instances:
      product:
        slidingWindowSize: 4
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      product:
        timeoutDuration: 2s
logging:
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%p","logger":"%logger","message":"%m"}%n'
