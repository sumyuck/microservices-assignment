apiVersion: v1
kind: Namespace
metadata: { name: retailflow }
---
apiVersion: v1
kind: Secret
metadata: { name: app-secrets, namespace: retailflow }
type: Opaque
stringData:
  JWT_SECRET: replace-this-before-demo
  MYSQL_PASSWORD: course-order-password
  POSTGRES_PASSWORD: course-product-password
---
apiVersion: v1
kind: ConfigMap
metadata: { name: consul-services, namespace: retailflow }
data:
  services.json: |
    {"services":[{"name":"product-service","address":"product-service","port":3001},{"name":"customer-service","address":"customer-service","port":8000},{"name":"order-service","address":"order-service","port":8083},{"name":"billing-service","address":"billing-service","port":8084},{"name":"notification-service","address":"notification-service","port":8085}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: consul, namespace: retailflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: consul } }
  template:
    metadata: { labels: { app: consul } }
    spec:
      containers:
        - name: consul
          image: "hashicorp/consul:1.19"
          args: ["agent", "-dev", "-client=0.0.0.0", "-config-dir=/consul/config"]
          ports: [{containerPort: 8500}]
          volumeMounts: [{name: config, mountPath: /consul/config}]
      volumes: [{name: config, configMap: {name: consul-services}}]
---
apiVersion: v1
kind: Service
metadata: { name: consul, namespace: retailflow }
spec: { selector: {app: consul}, ports: [{port: 8500, targetPort: 8500}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: retailflow }
spec:
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec: { containers: [{name: rabbitmq, image: "rabbitmq:3.13-management-alpine", env: [{name: RABBITMQ_DEFAULT_USER, value: course}, {name: RABBITMQ_DEFAULT_PASS, value: course}], ports: [{containerPort: 5672}, {containerPort: 15672}]}] }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: retailflow }
spec: { selector: {app: rabbitmq}, ports: [{name: amqp, port: 5672}, {name: management, port: 15672}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: product-db, namespace: retailflow }
spec:
  selector: { matchLabels: { app: product-db } }
  template:
    metadata: { labels: { app: product-db } }
    spec: { containers: [{name: postgres, image: "postgres:16-alpine", env: [{name: POSTGRES_DB, value: products}, {name: POSTGRES_USER, value: product}, {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: POSTGRES_PASSWORD}}}], volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]}], volumes: [{name: data, emptyDir: {}}] }
---
apiVersion: v1
kind: Service
metadata: { name: product-db, namespace: retailflow }
spec: { selector: {app: product-db}, ports: [{port: 5432}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: customer-db, namespace: retailflow }
spec:
  selector: { matchLabels: { app: customer-db } }
  template:
    metadata: { labels: { app: customer-db } }
    spec: { containers: [{name: mongo, image: "mongo:7", volumeMounts: [{name: data, mountPath: /data/db}]}], volumes: [{name: data, emptyDir: {}}] }
---
apiVersion: v1
kind: Service
metadata: { name: customer-db, namespace: retailflow }
spec: { selector: {app: customer-db}, ports: [{port: 27017}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: order-db, namespace: retailflow }
spec:
  selector: { matchLabels: { app: order-db } }
  template:
    metadata: { labels: { app: order-db } }
    spec: { containers: [{name: mysql, image: "mysql:8.4", args: ["--default-authentication-plugin=mysql_native_password"], env: [{name: MYSQL_DATABASE, value: orders}, {name: MYSQL_USER, value: order}, {name: MYSQL_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: MYSQL_PASSWORD}}}, {name: MYSQL_ROOT_PASSWORD, value: course-root-password}], volumeMounts: [{name: data, mountPath: /var/lib/mysql}]}], volumes: [{name: data, emptyDir: {}}] }
---
apiVersion: v1
kind: Service
metadata: { name: order-db, namespace: retailflow }
spec: { selector: {app: order-db}, ports: [{port: 3306}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-db, namespace: retailflow }
spec:
  selector: { matchLabels: { app: notification-db } }
  template:
    metadata: { labels: { app: notification-db } }
    spec: { containers: [{name: redis, image: "redis:7-alpine", args: ["redis-server", "--appendonly", "yes"]}] }
---
apiVersion: v1
kind: Service
metadata: { name: notification-db, namespace: retailflow }
spec: { selector: {app: notification-db}, ports: [{port: 6379}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: product-service, namespace: retailflow }
spec:
  selector: { matchLabels: { app: product-service } }
  template:
    metadata: { labels: { app: product-service } }
    spec: { containers: [{name: product, image: "retailflow/product-service:latest", imagePullPolicy: Never, env: [{name: DATABASE_URL, value: "postgresql://product:course-product-password@product-db:5432/products"}], ports: [{containerPort: 3001}, {containerPort: 50051}], readinessProbe: {httpGet: {path: /health, port: 3001}}}] }
---
apiVersion: v1
kind: Service
metadata: { name: product-service, namespace: retailflow }
spec: { selector: {app: product-service}, ports: [{name: http, port: 3001}, {name: grpc, port: 50051}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: customer-service, namespace: retailflow }
spec:
  selector: { matchLabels: { app: customer-service } }
  template:
    metadata: { labels: { app: customer-service } }
    spec: { containers: [{name: customer, image: "retailflow/customer-service:latest", imagePullPolicy: Never, env: [{name: MONGO_URL, value: "mongodb://customer-db:27017"}], ports: [{containerPort: 8000}], readinessProbe: {httpGet: {path: /health, port: 8000}}}] }
---
apiVersion: v1
kind: Service
metadata: { name: customer-service, namespace: retailflow }
spec: { selector: {app: customer-service}, ports: [{port: 8000}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: order-service, namespace: retailflow }
spec:
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec: { containers: [{name: order, image: "retailflow/order-service:latest", imagePullPolicy: Never, env: [{name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://order-db:3306/orders"}, {name: SPRING_DATASOURCE_USERNAME, value: order}, {name: SPRING_DATASOURCE_PASSWORD, value: course-order-password}, {name: RABBITMQ_HOST, value: rabbitmq}, {name: PRODUCT_GRPC_HOST, value: product-service}], ports: [{containerPort: 8083}], readinessProbe: {httpGet: {path: /health, port: 8083}}}] }
---
apiVersion: v1
kind: Service
metadata: { name: order-service, namespace: retailflow }
spec: { selector: {app: order-service}, ports: [{port: 8083}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: billing-service, namespace: retailflow }
spec:
  selector: { matchLabels: { app: billing-service } }
  template:
    metadata: { labels: { app: billing-service } }
    spec: { containers: [{name: billing, image: "retailflow/billing-service:latest", imagePullPolicy: Never, env: [{name: RABBITMQ_URL, value: "amqp://course:course@rabbitmq:5672/"}], ports: [{containerPort: 8084}], volumeMounts: [{name: data, mountPath: /data}]}], volumes: [{name: data, emptyDir: {}}] }
---
apiVersion: v1
kind: Service
metadata: { name: billing-service, namespace: retailflow }
spec: { selector: {app: billing-service}, ports: [{port: 8084}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service, namespace: retailflow }
spec:
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec: { containers: [{name: notification, image: "retailflow/notification-service:latest", imagePullPolicy: Never, env: [{name: REDIS_CONNECTION, value: "notification-db:6379"}, {name: RABBITMQ_HOST, value: rabbitmq}], ports: [{containerPort: 8085}]}] }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: retailflow }
spec: { selector: {app: notification-service}, ports: [{port: 8085}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: retailflow }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec: { containers: [{name: gateway, image: "retailflow/api-gateway:latest", imagePullPolicy: Never, env: [{name: JWT_SECRET, valueFrom: {secretKeyRef: {name: app-secrets, key: JWT_SECRET}}}, {name: PRODUCT_URL, value: "http://product-service:3001"}, {name: CUSTOMER_URL, value: "http://customer-service:8000"}, {name: ORDER_URL, value: "http://order-service:8083"}, {name: BILLING_URL, value: "http://billing-service:8084"}, {name: NOTIFICATION_URL, value: "http://notification-service:8085"}], ports: [{containerPort: 8080}], readinessProbe: {httpGet: {path: /health, port: 8080}}}] }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: retailflow }
spec: { type: NodePort, selector: {app: api-gateway}, ports: [{port: 8080, nodePort: 30080}] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gateway-is-public-entry, namespace: retailflow }
spec:
  podSelector: { matchLabels: { app: api-gateway } }
  policyTypes: [Ingress]
  ingress: [{}]
